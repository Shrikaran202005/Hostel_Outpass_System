services:
  - type: web
    name: hostel-outing-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && python backend/seed_data.py
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-outing-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

databases:
  - name: hostel-outing-db
    databaseName: hostel_outing_db
    user: hostel_user
    plan: free
